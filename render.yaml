services:
  # Backend API (Flask + PostGIS). Base de datos externa: Supabase (Supavisor session pooler, IPv4).
  - type: web
    name: expouno-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python back.py
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SCRAPER_INTERVALO_MINUTOS
        value: "2880"

  # Frontend (React + Vite) como sitio estático servido por CDN.
  - type: web
    name: expouno-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"